<!doctype html>
<!--
  Roboto PR video (roboto-pr-video skill, design.md), 1080×1440 (3:4), 30 fps, dark or light.
  Do not restyle this file: the marble ground, the theme tokens, the hand-off and the music are approved as they are.
  #marble        the ground: Paper Shaders Warp, seeked by this timeline (frame-exact) + static grain
  #dim           the flat end ground; switches on behind the card once the card fills the frame
  middle         compositions/<slug>.html: title card (pixel → sans) → the beats → its card grows into the end card's ground
  end-card.html  the typed wordmark; its two lines come from data-variable-values
  #music         lofi bed; its drum hit lands on the wordmark's last letter
  All times here follow from the middle composition's EXIT: set them with scripts/retime.py <project> --exit <EXIT>.
  Render:
    npx hyperframes render --fps 30 --quality delivery -o renders/<name>-dark.mp4
    npx hyperframes render --fps 30 --quality delivery --variables '{"theme":"light"}' -o renders/<name>-light.mp4
-->
<html lang="en"
  data-composition-variables='[{"id":"theme","type":"enum","label":"Theme","default":"dark","options":[{"value":"dark","label":"Dark"},{"value":"light","label":"Light"}]}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1440" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/brand/vendor/roboto-marble.js"></script>
    <script src="assets/brand/vendor/roboto-mark.js"></script>
    <style>
      @font-face { font-family: "Geist"; font-weight: 400; src: url("assets/brand/fonts/Geist-Regular.woff2") format("woff2"); }
      @font-face { font-family: "Geist"; font-weight: 500; src: url("assets/brand/fonts/Geist-Medium.woff2") format("woff2"); }
      @font-face { font-family: "Geist Mono"; font-weight: 400; src: url("assets/brand/fonts/GeistMono-Regular.woff2") format("woff2"); }
      @font-face { font-family: "Geist Pixel Square"; font-weight: 400; src: url("assets/brand/fonts/GeistPixel-Square.woff2") format("woff2"); }
      /* theme tokens (design.md colors / light) */
      :root {
        --end: #000000; --card: #000000; --card-shadow: inset 0 0 0 1.5px #ffffff1f;
        --ink: #fafafa; --muted: #a1a1aa; --hair: #27272a; --field: #ffffff0f; --field-ring: #ffffff1f;
        --pill: #1c1c1f; --pill-ring: #ffffff26; --track: #3f3f46; --node: #71717a; --grain: 0.22;
      }
      :root[data-theme="light"] {
        --end: #ffffff; --card: #ffffff; --card-shadow: 0 30px 80px -30px #00000033, inset 0 0 0 1.5px #e4e4e7;
        --ink: #09090b; --muted: #71717a; --hair: #e4e4e7; --field: #f4f4f5; --field-ring: #e4e4e7;
        --pill: #f4f4f5; --pill-ring: #d4d4d8; --track: #d4d4d8; --node: #a1a1aa; --grain: 0.12;
      }
      :root .on-light { display: none; }
      :root[data-theme="light"] .on-light { display: block; }
      :root[data-theme="light"] .on-dark { display: none; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1440px; overflow: hidden; background: var(--end); }
      #root { position: relative; width: 100%; height: 100%; }
      #marble, #grain, #dim { position: absolute; inset: 0; }
      #marble { z-index: 0; }
      #grain { z-index: 1; background: url("assets/brand/grain.png"); mix-blend-mode: overlay; opacity: var(--grain); }
      #dim { z-index: 2; background: var(--end); opacity: 0; }
      #cart-race { z-index: 3; }
      #end-card { z-index: 4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22.6" data-width="1080" data-height="1440">
      <div id="marble" data-layout-ignore></div>
      <div id="grain" data-layout-ignore></div>
      <div id="dim" data-layout-ignore></div>
      <div
        id="cart-race"
        data-composition-id="cart-race"
        data-composition-src="compositions/cart-race.html"
        data-start="0"
        data-duration="19.5"
        data-track-index="1"
        data-width="1080"
        data-height="1440"
      ></div>
      <div
        id="end-card"
        data-composition-id="end-card"
        data-composition-src="compositions/end-card.html"
        data-start="18.4"
        data-duration="4.2"
        data-track-index="2"
        data-width="1080"
        data-height="1440"
      ></div>
      <!--
        Lofi bed (design.md → Sound): low under the beat, swelling into the track's drum hit on the wordmark's
        last letter (EXIT + 1.25s). media-start, the volume lane and every duration are set by scripts/retime.py.
        data-volume + the limiter give −14 LUFS / ≤ −1 dBTP.
      -->
      <audio
        id="music"
        src="assets/brand/audio/just-in-time-lofi.mp3"
        data-start="0"
        data-duration="22.6"
        data-media-start="4.31"
        data-track-index="3"
        data-volume="1.65"
        data-fade-in="0.8"
        data-fade-out="0.6"
        data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0.56},{&quot;t&quot;:19.05,&quot;v&quot;:0.56},{&quot;t&quot;:19.65,&quot;v&quot;:1}]}]}"
        data-fx-chain="{&quot;version&quot;:1,&quot;nodes&quot;:[{&quot;type&quot;:&quot;limiter&quot;,&quot;id&quot;:&quot;n1&quot;,&quot;label&quot;:&quot;Delivery ceiling&quot;,&quot;params&quot;:{&quot;limit&quot;:-1.5}}]}"
      ></audio>
    </div>
    <script>
      (function () {
        const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        const theme = vars.theme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        const marble = RobotoMarble.mount(document.getElementById("marble"), theme);
        const clock = { t: 0 };
        const tl = gsap.timeline({ paused: true });
        // the marble is a pure function of film time: this tween only carries the clock
        tl.fromTo(clock, { t: 0 }, { t: 22.6, duration: 22.6, ease: "none", onUpdate: () => marble.seek(clock.t) }, 0);
        // hand-off: the card grows to fill the frame (EXIT + 0.05 to EXIT + 0.55); the flat ground takes over behind it (retime.py sets the time)
        tl.fromTo("#dim", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 19.0);   // behind the card once it fills the frame
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
